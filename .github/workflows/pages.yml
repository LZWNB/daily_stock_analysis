name: Deploy Web Preview to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/dsa-web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/dsa-web
        run: npm ci

      - name: Build static preview
        working-directory: apps/dsa-web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_PREVIEW: 'true'
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          cp static/index.html static/404.html
          touch static/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
